<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>TinyPNG Exporter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; color: #333; background: #fff; padding: 12px; }
  h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .field { margin-bottom: 10px; }
  label { display: block; font-weight: 500; margin-bottom: 4px; color: #555; }
  input, select {
    width: 100%; padding: 6px 8px; border: 1px solid #d0d0d0; border-radius: 4px; font-size: 12px; outline: none;
  }
  input:focus, select:focus { border-color: #18a0fb; }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; }
  .hint { font-size: 10px; color: #999; margin-top: 3px; }
  .hint a { color: #18a0fb; text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  .btn { width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn-primary { background: #18a0fb; color: #fff; }
  .btn-primary:hover { background: #0d8de0; }
  .btn-primary:disabled { background: #a0cfed; cursor: not-allowed; }
  hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
  #log { margin-top: 10px; background: #f7f7f7; border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px; height: 130px; overflow-y: auto; font-size: 11px; line-height: 1.7; font-family: monospace; }
  .i { color: #333; } .s { color: #1a8a3a; } .e { color: #d0021b; } .w { color: #d48806; }
  #progress-bar-wrap { margin-top: 6px; background: #eee; border-radius: 2px; height: 4px; display: none; }
  #progress-bar { height: 4px; background: #18a0fb; border-radius: 2px; width: 0%; transition: width 0.2s; }
  .key-wrap { position: relative; }
  .toggle-key { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 11px; color: #999; }
  details { margin-bottom: 10px; }
  summary { font-size: 11px; color: #888; cursor: pointer; user-select: none; }
  summary:hover { color: #555; }
  .check-label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check-label input { width: auto; margin: 0; }
</style>
</head>
<body>
<h2>TinyPNG Exporter</h2>

<div class="field">
  <label>TinyPNG API Key</label>
  <div class="key-wrap">
    <input id="apiKey" type="password" placeholder="your_tinypng_api_key" autocomplete="off" />
    <button class="toggle-key" id="toggleKey">显示</button>
  </div>
  <div class="hint">前往 <a href="https://tinypng.com/developers" target="_blank" rel="noopener noreferrer">tinypng.com/developers</a> 免费申请</div>
</div>

<details id="advancedSection">
  <summary>高级设置 ▸</summary>
  <div style="padding-top:8px;">
    <div class="field">
      <label>Worker 代理地址</label>
      <input id="workerBase" type="text" placeholder="https://your-worker.workers.dev" autocomplete="off" />
      <div class="hint">
        留空则使用默认地址。担心 API Key 泄露？
        <a id="workerCodeLink" href="#" target="_blank" rel="noopener noreferrer">查看 Worker 源码</a>，自行部署到 Cloudflare。
      </div>
    </div>
  </div>
</details>

<div class="row">
  <div class="field">
    <label>压缩次数</label>
    <input id="compressionTimes" type="number" min="1" max="10" value="2" />
    <div class="hint">循环压缩次数（1~10）</div>
  </div>
  <div class="field">
    <label>导出格式</label>
    <select id="exportFormat">
      <option value="png">PNG</option>
      <option value="jpg">JPG</option>
      <option value="webp">WebP</option>
    </select>
  </div>
</div>

<div class="field">
  <label>导出倍率</label>
  <select id="exportScale">
    <option value="1">1x</option>
    <option value="2" selected>2x</option>
    <option value="3">3x</option>
  </select>
</div>

<div class="field">
  <label>并发上传数</label>
  <input id="concurrency" type="number" min="1" max="8" value="4" />
  <div class="hint">并行上传的图层数，只缩短等待时间，不省配额（1~8）</div>
</div>

<div class="field">
  <label class="check-label">
    <input id="zipMode" type="checkbox" checked />
    多选时打包为 ZIP 下载（推荐）
  </label>
  <div class="hint">浏览器/桌面端会静默拦截连续的多次自动下载，打包成一个 zip 只下载一次更稳</div>
</div>

<hr />
<button id="exportBtn" class="btn btn-primary">导出并压缩选中图层</button>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>
<div id="log"></div>

<script>
const DEFAULT_WORKER_BASE = 'https://tinypng-upload.2854919592.workers.dev';
// Worker 源码托管地址（替换为你的 GitHub/Gist 链接）
const WORKER_CODE_URL = 'https://gist.github.com/GarF1eldGo/47cad866062d08bc74ffabba51bded4d';

const $ = id => document.getElementById(id);
const logEl = $('log');

function log(msg, type) {
  const d = document.createElement('div');
  d.className = type || 'i';
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function setProgress(pct) { $('progress-bar').style.width = pct + '%'; }

// Set worker code link
$('workerCodeLink').href = WORKER_CODE_URL;

$('toggleKey').addEventListener('click', function() {
  const inp = $('apiKey');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  this.textContent = inp.type === 'password' ? '显示' : '隐藏';
});

function getWorkerBase() {
  const custom = $('workerBase').value.trim().replace(/\/$/, '');
  return custom || DEFAULT_WORKER_BASE;
}

// ── base64 <-> Uint8Array（跨 postMessage 传二进制，比数字数组小 4 倍以上）──────
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64(bytes) {
  const parts = [];
  const CHUNK = 8192;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK)));
  }
  return btoa(parts.join(''));
}

// ── Promise bridge: network calls delegated to code.ts sandbox ──────────────
const pending = {};
let reqIdCounter = 0;

function pluginFetch(type, params) {
  return new Promise((resolve) => {
    const requestId = String(++reqIdCounter);
    pending[requestId] = resolve;
    parent.postMessage({ pluginMessage: { type, requestId, ...params } }, '*');
  });
}

async function tinypngUpload(data, apiKey, workerBase) {
  const res = await pluginFetch('tinypng-upload', { dataBase64: bytesToB64(data), apiKey, workerBase });
  const bodyStr = String(res.body != null ? res.body : '');
  if (!res.ok) {
    let errMsg = 'HTTP ' + res.status;
    try {
      const j = JSON.parse(bodyStr);
      errMsg = (j && j.message) ? j.message : ('HTTP ' + res.status + ' ' + bodyStr.slice(0, 300));
    } catch(_) { errMsg = bodyStr ? ('HTTP ' + res.status + ' ' + bodyStr.slice(0, 300)) : errMsg; }
    throw new Error(errMsg);
  }
  let json;
  try { json = JSON.parse(bodyStr); } catch(_) {
    throw new Error('响应解析失败: ' + bodyStr.slice(0, 200));
  }
  if (!json || !json.output || !json.output.url) {
    throw new Error('未返回 output.url: ' + bodyStr.slice(0, 200));
  }
  return json;
}

async function tinypngDownload(url, apiKey, format, workerBase) {
  const res = await pluginFetch('tinypng-download', { url, apiKey, format, workerBase });
  if (!res.ok) {
    const detail = res.error ? String(res.error) : ('HTTP ' + res.status);
    throw new Error('下载失败: ' + detail);
  }
  return b64ToBytes(res.dataBase64);
}

async function compressOnce(data, apiKey, format, workerBase) {
  const uploadResult = await tinypngUpload(data, apiKey, workerBase);
  return await tinypngDownload(uploadResult.output.url, apiKey, format, workerBase);
}

// Figma 无法直接导出 WebP：先把无损 PNG 在浏览器端（Chromium 原生编码器）
// 转为最高画质 WebP，再交给 TinyPNG 压缩
async function pngToWebp(data) {
  const blob = new Blob([new Uint8Array(data)], { type: 'image/png' });
  const bitmap = await createImageBitmap(blob);
  try {
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0);
    const webpBlob = await new Promise(function(resolve, reject) {
      canvas.toBlob(function(b) {
        if (b && b.type === 'image/webp') resolve(b);
        else reject(new Error('当前环境不支持 WebP 编码'));
      }, 'image/webp', 1);
    });
    return new Uint8Array(await webpBlob.arrayBuffer());
  } finally {
    if (bitmap.close) bitmap.close();
  }
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

// ── ZIP 打包（store 方式，图片本身已压缩，无需再 deflate）──────────────────────
let crcTable = null;

function crc32(bytes) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[i] = c >>> 0;
    }
  }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(files) {
  const encoder = new TextEncoder();
  const now = new Date();
  const time = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() / 2) & 31);
  const date = (((now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

  const body = [];
  const central = [];
  let offset = 0;

  files.forEach(function(f) {
    const nameBytes = encoder.encode(f.filename);
    const crc = crc32(f.data);
    const size = f.data.length;

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);   // local file header
    lv.setUint16(4, 20, true);           // version needed
    lv.setUint16(6, 0x0800, true);       // flag: UTF-8 文件名
    lv.setUint16(8, 0, true);            // method: store
    lv.setUint16(10, time, true);
    lv.setUint16(12, date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    body.push(local, f.data);

    const entry = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(entry.buffer);
    cv.setUint32(0, 0x02014b50, true);   // central directory header
    cv.setUint16(4, 20, true);           // version made by
    cv.setUint16(6, 20, true);           // version needed
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, time, true);
    cv.setUint16(14, date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);      // 本地头偏移
    entry.set(nameBytes, 46);
    central.push(entry);

    offset += local.length + size;
  });

  const centralSize = central.reduce(function(n, c) { return n + c.length; }, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);     // end of central directory
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);

  const out = new Uint8Array(offset + centralSize + eocd.length);
  let pos = 0;
  body.concat(central).forEach(function(part) {
    out.set(part, pos);
    pos += part.length;
  });
  out.set(eocd, pos);
  return out;
}

// ── 下载 ────────────────────────────────────────────────────────────────────
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  // 立即 revoke 可能打断正在写入的下载，统一延后回收
  setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function sleep(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

// 同名图层（多个 icon、Frame 等）打包进同一个 zip 会互相覆盖，这里加序号去重
function uniqueFilename(name) {
  let candidate = name;
  let n = 2;
  while (results.some(function(r) { return r.filename === candidate; })) {
    const dot = name.lastIndexOf('.');
    candidate = dot > 0
      ? name.slice(0, dot) + '-' + n + name.slice(dot)
      : name + '-' + n;
    n++;
  }
  return candidate;
}

function zipStamp() {
  const d = new Date();
  const p = function(n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

// ── Task queue（多任务并发）──────────────────────────────────────────────────
let queue = [];
let activeCount = 0;
let doneCount = 0;
let totalExpected = 0;
let allSent = false;
let finished = false;
let idleTimer = null;
let concurrency = 4;
const results = [];    // { filename, data }
const failures = [];   // { name, reason }

// 并发泵：最多同时跑 concurrency 个任务，任务结束自动补位
function pump() {
  if (finished) return;
  while (activeCount < concurrency && queue.length > 0) {
    const task = queue.shift();
    activeCount++;
    processTaskSafe(task);
  }
  checkAllDone();
}

async function processTaskSafe(task) {
  try {
    await processTask(task);
  } catch (e) {
    // 单个图层出异常不能拖垮整个队列
    const reason = e && e.message ? e.message : String(e);
    failures.push({ name: task.filename, reason });
    log('  处理异常: ' + task.filename + ' — ' + reason, 'e');
    doneCount++;
    setProgress(Math.round((doneCount / Math.max(totalExpected, 1)) * 100));
  } finally {
    activeCount--;
    bumpIdleTimer();
    pump();
    checkAllDone();
  }
}

function checkAllDone() {
  if (!allSent || finished) return;
  if (queue.length > 0 || activeCount > 0) return;
  if (doneCount < totalExpected) return;
  finalize();
}

// 兜底：全部消息已发完、队列也空了，但收到的图层数少于选中数（postMessage 丢消息）
function bumpIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(function() {
    if (!allSent || finished) return;
    if (queue.length > 0 || activeCount > 0) return;
    if (doneCount >= totalExpected) return;
    log('警告: ' + (totalExpected - doneCount) + ' 个图层未收到导出数据，先保存已完成的文件', 'w');
    failures.push({ name: '未收到数据的图层', reason: '共 ' + (totalExpected - doneCount) + ' 个' });
    finalize();
  }, 10000);
}

async function finalize() {
  if (finished) return;
  finished = true;
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }

  try {
    const zipMode = $('zipMode').checked && results.length > 1;
    if (zipMode) {
      log('打包 ' + results.length + ' 个文件为 ZIP...');
      const zipData = buildZip(results);
      triggerDownload(new Blob([zipData], { type: 'application/zip' }), 'tinypng-export-' + zipStamp() + '.zip');
      log('已保存: tinypng-export.zip（' + fmtBytes(zipData.length) + '，含 ' + results.length + ' 个文件）', 's');
    } else {
      // 逐个下载：多次自动下载可能被拦截，间隔一下更稳
      for (let i = 0; i < results.length; i++) {
        const r = results[i];
        triggerDownload(new Blob([r.data]), r.filename);
        log('  已保存: ' + r.filename, 's');
        if (i < results.length - 1) await sleep(300);
      }
    }
  } catch (e) {
    log('保存失败: ' + (e && e.message ? e.message : e), 'e');
  }

  if (failures.length > 0) {
    log('处理结束：成功 ' + results.length + ' 个，失败 ' + failures.length + ' 个', 'w');
    failures.forEach(function(f) { log('  失败: ' + f.name + ' — ' + f.reason, 'e'); });
  } else {
    log('全部完成！共处理 ' + results.length + ' 个图层', 's');
  }
  $('exportBtn').disabled = false;
}

async function processTask(task) {
  const { filename, format, compressionTimes, workerBase } = task;
  const apiKey = $('apiKey').value.trim();
  log('开始处理: ' + filename);

  let current = b64ToBytes(task.dataBase64);
  let failed = false;
  let reason = '';

  if (format === 'webp') {
    log('  PNG → WebP 转换中...');
    try {
      const pngSize = current.length;
      current = await pngToWebp(current);
      log('  转换完成: ' + fmtBytes(pngSize) + ' → ' + fmtBytes(current.length), 's');
    } catch(e) {
      log('  PNG → WebP 转换失败: ' + e.message, 'e');
      failed = true;
      reason = 'WebP 转码失败';
    }
  }

  const originalSize = current.length;

  for (let round = 1; !failed && round <= compressionTimes; round++) {
    log('  第 ' + round + '/' + compressionTimes + ' 次压缩...');
    try {
      current = await compressOnce(current, apiKey, format, workerBase);
      const saved = ((1 - current.length / originalSize) * 100).toFixed(1);
      log('  压缩完成，共节省 ' + saved + '%', 's');
    } catch(e) {
      log('  第 ' + round + ' 次压缩失败: ' + e.message, 'e');
      failed = true;
      reason = e.message;
      break;
    }
  }

  if (!failed) {
    results.push({ filename: uniqueFilename(filename), data: current });
  } else {
    failures.push({ name: filename, reason });
    log('  跳过保存（压缩失败）', 'w');
  }

  setProgress(Math.round((doneCount / Math.max(totalExpected, 1)) * 100));
  doneCount++;
  checkAllDone();
}

// ── Messages from code.ts ───────────────────────────────────────────────────
window.onmessage = function(event) {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'tinypng-upload-result' || msg.type === 'tinypng-download-result') {
    const resolve = pending[msg.requestId];
    if (resolve) { delete pending[msg.requestId]; resolve(msg); }
    return;
  }
  if (msg.type === 'load-settings') {
    if (msg.apiKey) $('apiKey').value = msg.apiKey;
    if (msg.workerBase) $('workerBase').value = msg.workerBase;
    return;
  }
  if (msg.type === 'export-error') {
    $('exportBtn').disabled = false;
    log('错误: ' + msg.message, 'e');
    return;
  }
  if (msg.type === 'layer-error') {
    log('Figma 导出失败: ' + (msg.name ? msg.name + ' — ' : '') + msg.message, 'e');
    failures.push({ name: msg.name || '未命名图层', reason: msg.message });
    doneCount++;
    setProgress(Math.round((doneCount / Math.max(totalExpected, 1)) * 100));
    checkAllDone();
    return;
  }
  if (msg.type === 'compress-and-save') {
    queue.push(msg);
    bumpIdleTimer();
    pump();
    return;
  }
  if (msg.type === 'all-layers-sent') {
    allSent = true;
    totalExpected = msg.total;
    bumpIdleTimer();
    checkAllDone();
    return;
  }
};

$('exportBtn').addEventListener('click', function() {
  const apiKey = $('apiKey').value.trim();
  if (!apiKey) { log('请先输入 TinyPNG API Key', 'w'); return; }
  const times = parseInt($('compressionTimes').value, 10) || 2;
  if (times < 1 || times > 10) { log('压缩次数范围为 1~10', 'w'); return; }

  const workerBase = getWorkerBase();
  concurrency = Math.min(8, Math.max(1, parseInt($('concurrency').value, 10) || 4));

  this.disabled = true;
  logEl.innerHTML = '';
  queue = []; activeCount = 0; doneCount = 0; totalExpected = 0; allSent = false;
  finished = false; results.length = 0; failures.length = 0;
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  $('progress-bar-wrap').style.display = 'block';
  setProgress(0);

  // Persist settings
  parent.postMessage({ pluginMessage: {
    type: 'save-settings',
    apiKey,
    workerBase: $('workerBase').value.trim(),
  }}, '*');

  parent.postMessage({ pluginMessage: {
    type: 'start-export',
    apiKey,
    compressionTimes: times,
    format: $('exportFormat').value,
    scale: parseFloat($('exportScale').value),
    workerBase,
  }}, '*');
});

parent.postMessage({ pluginMessage: { type: 'get-settings' } }, '*');
</script>
</body>
</html>
